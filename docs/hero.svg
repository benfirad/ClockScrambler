<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">ClockScrambler</title>
  <desc id="desc">A customizable privacy-aware clock overlay for the macOS menu bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#242026"/></linearGradient>
    <linearGradient id="privacy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9f0a"/><stop offset="1" stop-color="#bf5af2"/></linearGradient>
  </defs>
  <rect width="1440" height="560" rx="36" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
