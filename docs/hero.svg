    <circle cx="60" cy="42" r="7" fill="#bf5af2"/>
    <text x="102" y="54" fill="#f7f7f7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="36" font-weight="700">17:30  🌙</text>
