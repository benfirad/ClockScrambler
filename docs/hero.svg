      <text x="28" y="48" fill="#8c8790" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">CLOCK STYLE</text>
      <rect x="28" y="70" width="364" height="56" rx="15" fill="#242126"/>
      <text x="48" y="106" fill="#f7f7f7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">Written • “half past five”</text>
      <rect x="28" y="144" width="174" height="44" rx="22" fill="#ff9f0a"/><text x="71" y="173" fill="#14110c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">MIC ACTIVE</text>
      <rect x="218" y="144" width="174" height="44" rx="22" fill="#bf5af2"/><text x="247" y="173" fill="#160d1d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">SCREEN SHARE</text>
