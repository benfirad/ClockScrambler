name: ClockScrambler

options:
  bundleIdPrefix: local.firat
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  ClockScrambler:
    type: application
    platform: macOS
    sources:
      - path: ClockScrambler
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.firat.ClockScrambler
        PRODUCT_NAME: ClockScrambler
        INFOPLIST_FILE: ClockScrambler/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

schemes:
  ClockScrambler:
    build:
      targets:
        ClockScrambler: all
    run:
      config: Debug
    archive:
      config: Release
